services:
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - reconciliation_net
    restart: always

  app:
    build: .
    container_name: reconciliation_app
    environment:
      - PORT=5000
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USER=transactpay_user
      - DB_PASSWORD=SecurePassword123!
      - DB_NAME=reconciliation_db
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - reconciliation_net
    restart: always

  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: transactpay_user
      POSTGRES_PASSWORD: SecurePassword123!
      POSTGRES_DB: reconciliation_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transactpay_user -d reconciliation_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reconciliation_net
    restart: always

volumes:
  pgdata:

networks:
  reconciliation_net:
    driver: bridge
