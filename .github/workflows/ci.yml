name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: transactpay_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: postgrespassword
        DB_NAME: transactpay_db
        JWT_SECRET: test_jwt_secret
        TRANSACTPAY_WEBHOOK_SECRET: test_webhook_secret_key
      run: npm test
